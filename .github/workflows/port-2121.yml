name: Geyser 2.12.1 port CI

on:
  push:
    branches:
      - port/geyser-2.12.1
  workflow_dispatch:

concurrency:
  group: geyser-net-ease-2121-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Check source isolation invariants
        run: python3 -m unittest discover -s tests -v
      - name: Compile and package
        run: chmod +x ./gradlew && ./gradlew --no-daemon clean shadowJar --stacktrace
      - name: Publish test artifact (not for production)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GeyserNetease-test-only
          path: build/libs/*.jar
          if-no-files-found: error
